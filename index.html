<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Visual Canvas</title>
    <style>
        :root {
            --bg-color: #121214;
            --grid-color: rgba(255, 255, 255, 0.04);
            --ui-bg: #1e1e24;
            --accent: #6366f1;
            --text: #e4e4e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--ui-bg);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button.mode-active {
            background-color: #22c55e;
        }

        #hint {
            font-size: 13px;
            color: #a1a1aa;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Infinite engineering grid pattern backdropped beneath HTML5 Canvas drawings */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btn-add-node">Add Node</button>
        <button id="btn-connect-mode">Edge Mode: Off</button>
        <span id="hint">Click two nodes in sequence to build a connection.</span>
    </div>

    <canvas id="canvas-board"></canvas>

    <script src="canvas.js"></script>
</body>
</html>
